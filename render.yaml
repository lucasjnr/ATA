services:
  # ── Backend (FastAPI) ─────────────────────────────────────────────────
  - type: web
    name: ata-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false          # preencher manualmente no dashboard
      - key: DB_NAME
        value: ata_db
      - key: JWT_SECRET
        generateValue: true  # gerado automaticamente pelo Render
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_HOURS
        value: 72
      - key: EMERGENT_LLM_KEY
        sync: false          # preencher manualmente no dashboard
      - key: CORS_ORIGINS
        value: "*"

  # ── Frontend (React static site) ──────────────────────────────────────
  - type: web
    name: ata-frontend
    runtime: static
    rootDir: frontend
    buildCommand: yarn install && yarn build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: ata-backend
          property: hostWithScheme
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
